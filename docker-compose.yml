services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-textile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-textile}
      POSTGRES_DB: ${POSTGRES_DB:-textile}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-textile} -d ${POSTGRES_DB:-textile}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-textile}:${POSTGRES_PASSWORD:-textile}@db:5432/${POSTGRES_DB:-textile}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-secret}
      STORAGE_DIR: /data/photos
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - photos:/data/photos
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  photos:
